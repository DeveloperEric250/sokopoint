<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful - SokoPoint</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --bg-color: #f0fdf4;
            --card-bg: #ffffff;
            --text-dark: #064e3b;
            --text-muted: #4b5563;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .success-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background: #d1fae5;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px auto;
        }

        h2 {
            margin: 0 0 12px 0;
            font-size: 2rem;
            color: var(--text-dark);
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 32px;
            font-size: 1.1rem;
        }

        .order-summary {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            margin-bottom: 32px;
            border: 1px solid #e2e8f0;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #cbd5e1;
        }
        
        .summary-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .summary-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .summary-value {
            font-weight: 600;
            color: #1e293b;
        }

        .btn {
            display: block;
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="icon-container">
            <svg style="width: 40px; height: 40px;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        
        <h2>Order Successful!</h2>
        <p class="subtitle">Thank you for your purchase.</p>
        
        <div class="order-summary">
            <div class="summary-item">
                <span class="summary-label">Order Number</span>
                <span class="summary-value">#{{ order.id }}</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Item</span>
                <span class="summary-value">{{ product.name }}</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Total Paid</span>
                <span class="summary-value">{{ order.total_amount }}</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Delivering To</span>
                <span class="summary-value" style="max-width: 60%; text-align: right; word-wrap: break-word;">{{ order.delivery_address }}</span>
            </div>
        </div>
        
        <a href="{% url 'customer_dashboard' %}" class="btn">Continue Shopping</a>
    </div>
</body>
</html>
